# Every place the page text differs from sculpt.no as captured 2026-10-29, in
# Norwegian for the client. Their client page renders it from the forge, so the
# shape is client-pages' (scripts/text-changes-core.mjs); CI requires an
# entry in the same push as a wording change (AGENTS.md, Content fidelity).
note: Alt ble hentet fra dagens side 29. oktober 2026, og en kopi av sidene slik de så ut da er tatt vare på, så alt her kan etterprøves. Under står hvert avvik fra originalen, med begrunnelse. Ønsker du noe tilbakestilt, er det bare å si fra.
groups:
  - title: Alle sidene
    points:
      - title: "Teksten er den som vises på PC"
        text: |-
          Dagens side viser delvis forskjellig tekst på PC og på mobil. Den nye siden har én tekst som brukes på alle skjermer, og den er hentet fra PC-visningen, som er den nyeste. Tekst som bare vises på mobil i dag er ikke tatt med. Det gjelder forsiden, «Om skulpturen» og «Sculpt i utvikling», se under hver side.
      - title: "Kortere navn i menyen"
        text: Flere menypunkter på dagens side har sidetittelen med seg i navnet, og noen har fått et kortere navn. Overskriftene på sidene og sidetitlene (det som står i nettleserfanen og i søkeresultater) er beholdt som de er.
        table:
          head: [Før, Etter]
          rows:
            - [Kunstneren bak Sculpt | Norsk kunstner, Om oss]
            - [Sculpt i utvikling | Sculpt, En del av «Om oss»]
            - [Skulpturen | Sculpt, En del av «Prosessen»]
            - [Oppsatte tider og steder | Sculpt, Tider og steder]
            - [Gravidskulptur | Sculpt, Gravidskulptur]
            - [Andre skulpturer | Sculpt, Andre skulpturer]
      - title: "Nye hjelpetekster i menyen"
        text: Lenken «Hopp til innhold» (for tastatur og skjermleser) og navnet «Sculpt, til forsiden» på logoen. Ingen av dem er synlige i vanlig bruk, og dagens side har dem ikke.
      - title: "Menyknappen på mobil heter «Meny»"
        text: På mobil ligger menyen bak en knapp. Dagens side bruker et ikon med to streker, den nye siden skriver «Meny» på knappen.
      - title: "Navnet ved siden av logoen"
        text: «Sculpt» står nå med tekst ved siden av logoen øverst på hver side. Dagens side viser bare logoen.
      - title: "«Nettside av Cazworks» er fjernet fra bunnen"
        text: Den nye siden er ikke laget av Cazworks, så linjen er tatt ut.
      - title: "Bunnteksten har fått e-post, telefon og firmaopplysninger"
        text: Lenkene til «Kontakt», «Om oss», «Priser», «Galleri» og «Prosessen» er tatt ut av bunnteksten, siden menyen øverst alltid er synlig og har de samme sidene. Bunnteksten har i stedet e-postadressen og telefonnummeret fra kontaktsiden, ikonene for sosiale medier, «Sculpt Svindland ENK, org.nr. 933 506 401, Flekkefjord», hentet fra Brønnøysundregistrene, og en liten lenke, «Kildekode», til koden bak nettsiden. På PC står alt på én linje, på mobil under hverandre. Overskriften «Sosiale medier» vises ikke lenger, men skjermlesere leser den fortsatt opp ved ikonene.
      - title: "Menyen følger veien til en bestilling"
        text: Dagens meny har «Om oss» med fire sider under, så «Kontakt», «Gallerier», «Priser» og «Prosessen». Den nye menyen har sidene i den rekkefølgen en kunde trenger dem, «Gallerier», «Prosessen», «Priser», «Tider og steder», «Om oss» og «Kontakt», og bare «Gallerier» har sider under seg. Skannedagene lå under «Om oss», der den som leter etter en dag å skanne ikke ser etter dem, så de har fått sitt eget punkt. «Om oss» går rett til «Kunstneren bak Sculpt», og teksten fra «Sculpt i utvikling» står nederst på «Om oss».
      - title: "En knapp til bestilling nederst"
        text: «Kunstneren bak Sculpt», «Prosessen», «Gravidskulptur», «Andre skulpturer» og forsiden har fått knappen «Bestill din skulptur» nederst, med samme tekst og lenke som knappen øverst på forsiden. Den som har lest ferdig, kommer da rett til bestilling uten å lete i menyen.
      - title: "Bilder med filnavn som beskrivelse har fått tom beskrivelse"
        text: Bildene har en skjult beskrivelse som skjermlesere leser opp. På dagens side er den for mange av bildene bare filnavnet, for eksempel «Bjelland Foto-8638.jpg» og «20250213_093049.jpg» på forsiden, «Image 7.jpeg» på kontaktsiden og «20250814_083919.jpg» under «Andre skulpturer». Et filnavn sier ingenting om bildet, så disse har fått tom beskrivelse, og skjermleseren hopper over dem. De andre beskrivelsene er beholdt ordrett. Vil du skrive egne beskrivelser til disse bildene, legger jeg dem inn.
  - title: Forside
    points:
      - title: "Påmeldingen til nyhetsbrevet er ikke med"
        text: «Få oppdateringer fra Sculpt» og «Meld deg på for inspirasjon, nyheter og informasjon om skulpturer og kommende tilgjengelige skanninger.» står nederst på dagens forside. Om skjemaet lagrer påmeldingene noe sted, kan ikke sjekkes utenfra, så det er utelatt til det er avklart om nyhetsbrevet skal være med.
      - title: "Alle kundeomtalene står samlet"
        text: Dagens forside har tre kundeomtaler helt øverst, over bildet, og tre til under «Hva kundene våre sier». De tre øverste er flyttet ned, så forsiden begynner med bildet og overskriften. Under «Hva kundene våre sier» står de tre som før, og de tre andre vises med knappen «Vis flere omtaler» under dem. Når de er åpne, står knappen under alle seks og heter «Vis færre omtaler». Omtalene er ordrett som før, men står med vanlig skrift og uten anførselstegn, som de tre andre.
      - title: "Overskriften synes uten å bla"
        text: Bildet øverst viser alle skulpturene hele på alle skjermer, og glir nederst over i bakgrunnen. På store skjermer er det like bredt som innholdet under, og på lave skjermer litt mindre, så overskriften under det synes med en gang, også på en liten PC-skjerm.
      - title: "Bildet og overskriften øverst på mobil"
        text: På mobil begynner dagens forside med de tre kundeomtalene, og overskriften og «Bestill din skulptur» kommer først etter halvannen skjermhøyde. På den nye siden er bildet en lavere stripe på mobil, så bildet og overskriften synes med en gang, og knappen kommer rett etter innledningen.
      - title: "Kunstneren presenteres kort på forsiden"
        text: Under «Møt kunstneren bak Sculpt» sto hele historien om hvordan Sculpt startet, den samme teksten som på «Kunstneren bak Sculpt». Forsiden har nå bare første avsnitt, med lenken «Les mer om meg» til den siden under, slik mobilvisningen av dagens forside allerede gjør. Linjen «— Kunstner og daglig leder» er tatt bort, siden overskriften allerede sier at det er kunstneren.
      - title: "Piler ved bildene av skulpturene"
        text: På PC har bildestripen under «Våre skulpturer» fått en pil i hver ende, siden en mus eller styreplate ikke alltid kan bla sidelengs. Pilene heter «Forrige bilder» og «Neste bilder» for skjermlesere. På mobil blar man med fingeren som før, uten piler.
      - title: "Prosessen vises kort på forsiden"
        text: Under «En enkel og trygg prosess – steg for steg» sto hele teksten til hvert av de seks stegene, nesten ordrett den samme som på «Prosessen». Søkemotorer ser samme tekst på to sider som en kopi, og forsiden blir kortere uten den. Forsiden har nå innledningen og navnene på de seks stegene, med knappen «Les mer om prosessen» under. Linjen «Her er en oversikt over hele prosessen, og hva du kan forvente fra første møte til skulpturen står klar i hendene dine.» er tatt ut, siden oversikten står på «Prosessen». Setningen «Du skannes naken eller med sømløs truse for best mulig detaljbevaring.» sto bare på forsiden og er flyttet til steg 2 på «Prosessen». Steg 3 og 5 var formulert litt annerledes på forsiden («Noen justeringer gjøres mens du er til stede», «Deretter fylles den og bearbeides for hånd før overflate og utførelse tilpasses»), og det er utgaven fra «Prosessen» som står igjen.
      - title: "Lenken til Google-anmeldelsene"
        text: Under «Andres anmeldelser» heter lenken til Google-anmeldelsene «Item description» på dagens side, en plassholdertekst fra Squarespace. Den heter nå «Les flere anmeldelser på Google».
      - title: "Tekst som bare vises på mobil"
        text: Mobilvisningen av dagens forside har en annen innledning og prosessen med litt andre formuleringer. Ingen av disse er med. Den kortere utgaven av sitatet fra Ester er tatt i bruk, se over.
        table:
          head: [Del, Bare på mobil]
          rows:
            - [Innledning, "Hos Sculpt er vi spesialisert på å forvandle mennesker og livets viktige øyeblikk til tidløse kunstverk gjennom presis 3D-skanning og håndverksmessig finish."]
            - [Prosessen, "Overskriften delt i to linjer, «En enkel og trygg prosess» og «– steg for steg», og stegene som punkter som åpnes med et trykk, fra «1. Konsultasjon og samtale» til «6. Levering», med teksten fra «Prosessen»-siden."]
  - title: Prosessen
    points:
      - title: "«Om skulpturen» står nederst på siden"
        text: Dagens side har «Om skulpturen» som egen side, og den forteller mye av det samme som «Prosessen» om skanningen, bearbeidingen og materialet. Teksten og bildet står nå ordrett nederst på «Prosessen», under overskriften «Om skulpturen», så alt om hvordan skulpturen blir til er samlet ett sted, med én knapp til bestilling under. Den gamle adressen, sculpt.no/omskulpturen, sender videre dit. Sidetittelen «Hvordan lages en personlig 3D-skulptur?» og beskrivelsen hørte til den gamle siden og brukes ikke lenger.
      - title: "Setning fra forsiden i steg 2"
        text: «Du skannes naken eller med sømløs truse for best mulig detaljbevaring.» sto bare i steg 2 på forsiden, og står nå sist i steg 2 her, se under «Forside».
      - title: "Navn og beskrivelse i søkeresultater"
        text: Siden heter «General 1» i nettleserfanen og i søkeresultater på dagens side, en plassholder fra Squarespace, og har ingen beskrivelse. Den heter nå «Prosessen» og har fått beskrivelsen «Slik foregår det å få laget en personlig skulptur hos Sculpt, fra første samtale og skanning til ferdig skulptur sendt hjem til deg.»
  - title: Priser
    points:
      - title: "Prislisten står øverst"
        text: Prislisten og «Bestill» kom etter avsnittene om positurer og design, nesten to skjermhøyder ned på mobil. Nå står de rett under innledningen, og positurer og design kommer etter. Teksten er den samme.
      - title: "Lik skrivemåte på modellene"
        text: «Premiummodell – 20 cm» er skrevet uten strek, som «Standardmodell 16 cm».
      - title: "Samme setning står én gang"
        text: «Dine egne former, foreviget i et personlig kunstverk. Et minne du kan glede deg over resten av livet, og som kan leve videre i generasjoner.» sto under begge modellene. Den står nå én gang, over dem begge.
  - title: Om skulpturen (nå på «Prosessen»)
    text: Mobilvisningen har en eldre utgave av teksten om materialet, som ikke er med.
    table:
      head: [Bare på mobil, På PC og på den nye siden]
      rows:
        - ["Skulpturene lages i en bio-basert plast (biopolymer) som er nedbrytbar under riktige forhold. ...", "Skulpturene fra Sculpt lages med en biobasert polymer som grunnmateriale. ..."]
        - ["På grunn av produksjonsmetoden kan det forekomme svake linjer i overflaten noen steder på skulpturen. ...", "Ettersom skulpturene fremstilles ved hjelp av 3D-printing, bygges de opp lag for lag, ..."]
        - [overflatefinisher, overflateutførelser]
  - title: Sculpt i utvikling (nå på «Om oss»)
    points:
      - title: "Teksten står nederst på «Om oss»"
        text: «Sculpt i utvikling» handler om planene for bedriften og samarbeid, ikke om noe en kunde trenger før en bestilling. Teksten og bildet står nå ordrett nederst på «Om oss», under overskriften «Sculpt i utvikling». Den gamle adressen, sculpt.no/under-utvikling, sender videre dit, så lenker og søkeresultater fortsatt finner teksten. Sidetittelen «Sculpt i utvikling | Sculpt — Sculpt» hørte til den gamle siden og brukes ikke lenger.
      - title: "Tekst som bare vises på mobil"
        text: Overskriften heter «Under utvikling» på mobil og «Sculpt i utvikling» på PC. Den nye siden bruker «Sculpt i utvikling», og har med setningen «Dessuten kan vi også tilby bedrifter, kunstnere og idrett samarbeid innenfor vår kategori.», som mangler på mobil.
      - title: "Det rullende båndet med ord er ikke med"
        text: Dagens side lar ordene «Nyskapende kunst ✳︎ Kreativ utvikling ✳︎ Tidløs form ✳︎ Unike uttrykk ✳︎ Håndlaget presisjon ✳︎ Personlig kunst ✳︎ Innovativt håndverk ✳︎ Autentisk uttrykk ✳︎» rulle over skjermen. Hvert ord og hver stjerne i båndet er merket som en hovedoverskrift, 17 i alt, mens den egentlige overskriften «Sculpt i utvikling» ikke er det. Det gjør det uklart for søkemotorer hva siden handler om. Båndet er derfor ikke tatt med til «Om oss».
  - title: Kontakt
    points:
      - title: "Påmeldingen til nyhetsbrevet er ikke med"
        text: «Monthly Dispatch» og «Sign up to receive news and updates.» står på engelsk nederst på dagens kontaktside. Utelatt av samme grunn som på forsiden.
      - title: "Kontaktskjemaet er ikke med ennå"
        text: E-postadressen og telefonnummeret står som før. Et skjema på den nye siden trenger et sted å sende meldingene, og det er ikke bestemt ennå.
      - title: "E-post og telefon er lenker"
        text: Et trykk på e-postadressen åpner en ny e-post med emnet «Bestilling» og linjene «By:», «Tid/måned:» og «Svangerskapsuke:» ferdig utfylt, siden det er det siden ber om. Et trykk på telefonnummeret ringer det på mobil, og den nye lenken «Send SMS» under åpner en melding til samme nummer.
